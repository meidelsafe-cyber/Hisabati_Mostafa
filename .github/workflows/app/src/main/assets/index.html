<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حساباتي</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { margin: 0; color: #38bdf8; font-size: 26px; }
    .calc-box { width: 100%; max-width: 360px; background: #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    #screen { width: 100%; height: 60px; background: #0f172a; border-radius: 10px; border: 1px solid #334155; color: #fff; font-size: 28px; text-align: left; padding: 10px 15px; direction: ltr; margin-bottom: 15px; display: flex; align-items: center; justify-content: flex-end; overflow-x: auto; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { background: #334155; border: none; outline: none; border-radius: 12px; color: #fff; font-size: 20px; padding: 16px 0; cursor: pointer; transition: 0.1s ease; }
    button:active { transform: scale(0.95); opacity: 0.8; }
    button.op { background: #0284c7; font-weight: bold; }
    button.action { background: #e11d48; }
    button.equal { background: #10b981; grid-column: span 2; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h1>حساباتي</h1>
  </div>
  <div class="calc-box">
    <div id="screen">0</div>
    <div class="grid">
      <button class="action" onclick="clearScreen()">C</button>
      <button class="action" onclick="delChar()">⌫</button>
      <button class="op" onclick="append('/')">÷</button>
      <button class="op" onclick="append('*')">×</button>
      
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="op" onclick="append('-')">-</button>
      
      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="op" onclick="append('+')">+</button>
      
      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('.')">.</button>
      
      <button onclick="append('0')">0</button>
      <button onclick="append('00')">00</button>
      <button class="equal" onclick="calc()">=</button>
    </div>
  </div>

  <script>
    let screen = document.getElementById('screen');
    let expr = '';

    function append(val) {
      if (screen.innerText === '0' && !isNaN(val)) {
        expr = val;
      } else {
        expr += val;
      }
      screen.innerText = expr;
    }

    function clearScreen() {
      expr = '';
      screen.innerText = '0';
    }

    function delChar() {
      expr = expr.slice(0, -1);
      screen.innerText = expr || '0';
    }

    function calc() {
      try {
        expr = String(Function('"use strict";return (' + expr + ')')());
        screen.innerText = expr;
      } catch (e) {
        screen.innerText = 'خطأ';
        expr = '';
      }
    }
  </script>
</body>
</html>
